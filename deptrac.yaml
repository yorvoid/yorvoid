# The dependency rules between YorvoID's packages (05 §2 of the requirements). A package may use only
# the packages listed under it. Each package gets its layer when it's added to the repository.
deptrac:
  paths:
    - ./packages
  exclude_files:
    - '#.*/vendor/.*#'
    - '#.*/node_modules/.*#'
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: ^YorvoID\\Core\\.*
    - name: Authn
      collectors:
        - type: classLike
          value: ^YorvoID\\Authn\\.*
    - name: Notifications
      collectors:
        - type: classLike
          value: ^YorvoID\\Notifications\\.*
    - name: IntentSigning
      collectors:
        - type: classLike
          value: ^YorvoID\\IntentSigning\\.*
    - name: Flows
      collectors:
        - type: classLike
          value: ^YorvoID\\Flows\\.*
    - name: Passkeys
      collectors:
        - type: classLike
          value: ^YorvoID\\Passkeys\\.*
    - name: Policy
      collectors:
        - type: classLike
          value: ^YorvoID\\Policy\\.*
    - name: Relations
      collectors:
        - type: classLike
          value: ^YorvoID\\Relations\\.*
    - name: Symfony
      collectors:
        - type: classLike
          value: ^YorvoID\\Symfony\\.*
    - name: Throttle
      collectors:
        - type: classLike
          value: ^YorvoID\\Throttle\\.*
    - name: IntentVerifier
      collectors:
        - type: classLike
          value: ^YorvoID\\IntentVerifier\\.*
    - name: Mail
      collectors:
        - type: classLike
          value: ^YorvoID\\Mail\\.*
    - name: Translation
      collectors:
        - type: classLike
          value: ^YorvoID\\Translation\\.*
    - name: Testing
      collectors:
        - type: classLike
          value: ^YorvoID\\Testing\\.*
    - name: VirtualAuthenticator
      collectors:
        - type: classLike
          value: ^YorvoID\\VirtualAuthenticator\\.*
  ruleset:
    Core: ~
    Authn:
      - Core
      - Throttle
    Notifications:
      - Core
      - Authn
      - Mail
    IntentSigning:
      - Core
      - Authn
      - IntentVerifier
      - Notifications
      - Throttle
    Flows:
      - Core
      - Authn
      - Throttle
    Passkeys:
      - Core
      - Authn
      - Flows
      - Notifications
      - Throttle
    Symfony:
      - Core
      - Authn
      - Flows
      - IntentSigning
      - IntentVerifier
      - Mail
      - Notifications
      - Passkeys
      - Policy
      - Relations
      - Throttle
      - Translation
    Policy:
      - Core
      - Relations
    Relations:
      - Core
    Throttle:
      - Core
    IntentVerifier: ~
    Mail:
      - Core
    Translation:
      - Core
    Testing:
      - Core
      - Authn
      - Flows
      - Passkeys
      - Policy
      - Relations
      - Symfony
      - Throttle
      - VirtualAuthenticator
    VirtualAuthenticator: ~
