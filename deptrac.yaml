# The dependency rules between YorvoID's packages (05 §2 of the requirements). A package may use only
# the packages listed under it. Each package gets its layer when it's added to the repository.
deptrac:
  paths:
    - ./packages
  exclude_files:
    - '#.*/vendor/.*#'
    - '#.*/node_modules/.*#'
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: ^YorvoID\\Core\\.*
    - name: Authn
      collectors:
        - type: classLike
          value: ^YorvoID\\Authn\\.*
    - name: Notifications
      collectors:
        - type: classLike
          value: ^YorvoID\\Notifications\\.*
    - name: IntentSigning
      collectors:
        - type: classLike
          value: ^YorvoID\\IntentSigning\\.*
    - name: Flows
      collectors:
        - type: classLike
          value: ^YorvoID\\Flows\\.*
    - name: Passkeys
      collectors:
        - type: classLike
          value: ^YorvoID\\Passkeys\\.*
    - name: Policy
      collectors:
        - type: classLike
          value: ^YorvoID\\Policy\\.*
    - name: PhpstanRules
      collectors:
        - type: classLike
          value: ^YorvoID\\PhpstanRules\\.*
    - name: PolicyTesting
      collectors:
        - type: classLike
          value: ^YorvoID\\PolicyTesting\\.*
    - name: Delegation
      collectors:
        - type: classLike
          value: ^YorvoID\\Delegation\\.*
    - name: Relations
      collectors:
        - type: classLike
          value: ^YorvoID\\Relations\\.*
    - name: Symfony
      collectors:
        - type: classLike
          value: ^YorvoID\\Symfony\\.*
    - name: Throttle
      collectors:
        - type: classLike
          value: ^YorvoID\\Throttle\\.*
    - name: IntentVerifier
      collectors:
        - type: classLike
          value: ^YorvoID\\IntentVerifier\\.*
    - name: Mail
      collectors:
        - type: classLike
          value: ^YorvoID\\Mail\\.*
    - name: Translation
      collectors:
        - type: classLike
          value: ^YorvoID\\Translation\\.*
    - name: Testing
      collectors:
        - type: classLike
          value: ^YorvoID\\Testing\\.*
    - name: VirtualAuthenticator
      collectors:
        - type: classLike
          value: ^YorvoID\\VirtualAuthenticator\\.*
  ruleset:
    Core: ~
    Authn:
      - Core
      - Throttle
    Notifications:
      - Core
      - Authn
      - Mail
    IntentSigning:
      - Core
      - Authn
      - IntentVerifier
      - Notifications
      - Throttle
    Flows:
      - Core
      - Authn
      - Throttle
    Passkeys:
      - Core
      - Authn
      - Flows
      - Notifications
      - Throttle
    Symfony:
      - Core
      - Authn
      - Delegation
      - Flows
      - IntentSigning
      - IntentVerifier
      - Mail
      - Notifications
      - Passkeys
      - Policy
      - Relations
      - Throttle
      - Translation
    Policy:
      - Core
      - Relations
    # For an application's PHPStan: it reads YorvoID's classes through PHPStan's reflection, and names none.
    PhpstanRules: ~
    # A development tool: nothing else refers to it, neither the bridge production runs nor the store
    # contracts it builds on (M2-5).
    PolicyTesting:
      - Core
      - Authn
      - Delegation
      - Passkeys
      - Policy
      - Relations
      - Testing
      - Throttle
    # Depends on core only, and only narrows what core decides (D-47).
    Delegation:
      - Core
    Relations:
      - Core
    Throttle:
      - Core
    IntentVerifier: ~
    Mail:
      - Core
    Translation:
      - Core
    # The verifier's store contracts use it only when it's installed (a "suggest"); it still depends on nothing.
    Testing:
      - Core
      - Authn
      - Delegation
      - Flows
      - IntentVerifier
      - Passkeys
      - Policy
      - Relations
      - Symfony
      - Throttle
      - VirtualAuthenticator
    VirtualAuthenticator: ~
