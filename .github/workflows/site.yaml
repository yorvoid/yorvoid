# Publishes the documentation site (docs/, arranged by site/) to GitHub Pages from main.
name: Site

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - site/**
      - .github/workflows/site.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the toolchain's image
        run: docker compose --profile node build node
      - name: Build the site
        run: |
          GID=$(id -g)
          export UID GID
          docker compose run --rm -w /app/site node sh -c 'npm ci && npm run build'
      - name: Upload it
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
