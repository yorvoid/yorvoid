---
name: npm

# Publishes the browser client (packages/browser) to npm as @yorvoid/browser, at each version tag, with
# the tag's version: all packages are released together. Only a signed tag whose commit is on main and passed
# CI. npm trusts this workflow (trusted publishing, OpenID Connect): there is no token to keep, and
# every version carries provenance that links it to this repository and run.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  checks: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the browser client
    if: github.repository == 'yorvoid/yorvoid'
    # npm's trusted publisher names this environment; only version tags can use it.
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is signed, on main, and passed CI
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: .github/release-check.sh "$GITHUB_REF_NAME"
      - name: Build the toolchain's image
        run: docker compose --profile node build node
      - name: Install dependencies and build
        run: |
          GID=$(id -g)
          export UID GID
          docker compose run --rm node sh -c 'npm ci && npm run build'
      # The tag's version, e.g. v0.1.0 → 0.1.0. A pre-release (0.1.0-rc.1) goes to "next", not "latest".
      - name: Publish
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          GID=$(id -g)
          export UID GID
          version=${TAG#v}
          channel=latest

          case "$version" in
            *-*) channel=next ;;
          esac

          # npm finds the workflow's identity, for trusted publishing and provenance, in these. Each goes in
          # with its value: a bare -e NAME leaves it to Compose to read the runner's environment.
          passed=()

          for name in $(compgen -e | grep -E '^(GITHUB|RUNNER|ACTIONS)_'); do
            passed+=(-e "$name=${!name}")
          done

          # Verbose, because npm logs why trusted publishing failed only at that level, then reports
          # just ENEEDAUTH.
          docker compose run --rm -e CI=true "${passed[@]}" node sh -c "npm version '$version' --no-git-tag-version && npm publish --access public --provenance --tag '$channel' --loglevel verbose"
