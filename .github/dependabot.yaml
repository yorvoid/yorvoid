version: 2
# Minor and patch updates come together, one pull request per ecosystem and directory each week, so
# that each runs CI once; major updates come one by one, as they may need changes.
updates:
  # Images are pinned by digest: Dependabot proposes the next tag and digest together.
  - package-ecosystem: docker
    directories:
      - /
      - /packages/browser
      - /spec
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
    # Each PHP stage stays on its version (the oldest supported is tested on 8.4): patches only. A new
    # PHP version is a stage of its own, added by hand.
    ignore:
      - dependency-name: php
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The PostgreSQL versions the tests run against: each stays on its major version.
  - package-ecosystem: docker
    directories:
      - /docker/postgres/16
      - /docker/postgres/17
      - /docker/postgres/18
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
    groups:
      postgres:
        patterns: ["postgres"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
    # Playwright's image holds the browsers for one version of @playwright/test (e2e/package.json): the
    # two move together, in the npm pull request for /e2e, which gets the image's tag and digest added.
    ignore:
      - dependency-name: playwright
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: composer
    directories:
      - /
      - /tools/compat/bc
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The browser client, which is published, and the tooling of the browser tests and the site.
  - package-ecosystem: npm
    directories:
      - /packages/browser
      - /e2e
      - /site
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
