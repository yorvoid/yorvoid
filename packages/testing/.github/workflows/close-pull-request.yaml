---
# This repository is a read-only copy of a directory of yorvoid/yorvoid, made by its "Split"
# workflow, so changes made here would be lost.
name: Close pull request

on:
  pull_request_target:
    types:
      - opened

permissions:
  pull-requests: write

jobs:
  close:
    name: Close pull request
    runs-on: ubuntu-latest
    steps:
      - name: Point to yorvoid/yorvoid
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr close "$PULL_REQUEST" --comment "Thanks for your pull request! This repository is a read-only copy of a part of [yorvoid/yorvoid](https://github.com/yorvoid/yorvoid), where YorvoID is developed. Please open it there."
