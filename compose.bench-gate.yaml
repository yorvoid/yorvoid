# The pull request's benchmark gate and its A/A record (M2-8, step 2): PostgreSQL without durability,
# so that the gate measures the queries, plans and locks, not how the runner's disk takes the WAL.
# Only these three settings: they change how WAL reaches the disk and nothing under test. main's
# table and the change since the last release keep them on (tools/bench/ci.sh checks both).
#
#   COMPOSE_FILE=compose.yaml:compose.bench-gate.yaml docker compose up --wait
services:
  postgres:
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
