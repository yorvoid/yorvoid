# The dependency rules between core's namespaces (D-47, AR-10, TOOLING-02). deptrac.yaml keeps the
# packages apart; this keeps core's parts from growing new edges. The list is today's edges
# (2026-11-19): a new one fails until it's added here, in review. The evaluator is a layer of its own,
# so that the decision point (Operation) asks only its port, Authorization, never the Evaluator (D-50).
# Root is core's top-level classes (Realm, Duration, Secret, Text, Time).
deptrac:
  paths:
    - ./packages/core/src
  exclude_files:
    - '#.*/vendor/.*#'
  layers:
    - name: Authorization
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^YorvoID\\Core\\Authorization\\.*
          must_not:
            - type: classLike
              value: ^YorvoID\\Core\\Authorization\\Evaluator$
    - name: Evaluator
      collectors:
        - type: classLike
          value: ^YorvoID\\Core\\Authorization\\Evaluator$
    - name: Clock
      collectors:
        - type: classLike
          value: ^YorvoID\\Core\\Clock\\.*
    - name: Crypto
      collectors:
        - type: classLike
          value: ^YorvoID\\Core\\Crypto\\.*
    - name: Event
      collectors:
        - type: classLike
          value: ^YorvoID\\Core\\Event\\.*
    - name: Exception
      collectors:
        - type: classLike
          value: ^YorvoID\\Core\\Exception\\.*
    - name: Id
      collectors:
        - type: classLike
          value: ^YorvoID\\Core\\Id\\.*
    - name: Key
      collectors:
        - type: classLike
          value: ^YorvoID\\Core\\Key\\.*
    - name: Log
      collectors:
        - type: classLike
          value: ^YorvoID\\Core\\Log\\.*
    - name: Migrations
      collectors:
        - type: classLike
          value: ^YorvoID\\Core\\Migrations\\.*
    - name: Operation
      collectors:
        - type: classLike
          value: ^YorvoID\\Core\\Operation\\.*
    - name: Principal
      collectors:
        - type: classLike
          value: ^YorvoID\\Core\\Principal\\.*
    - name: Storage
      collectors:
        - type: classLike
          value: ^YorvoID\\Core\\Storage\\.*
    - name: Root
      collectors:
        - type: classLike
          value: ^YorvoID\\Core\\[A-Za-z]+$
    # Whatever matches none of the layers above, e.g. a new namespace: it may depend on nothing, and
    # nothing may depend on it, until it's listed.
    - name: Unlisted
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^YorvoID\\Core\\.*
          must_not:
            - type: classLike
              value: ^YorvoID\\Core\\Authorization\\.*
            - type: classLike
              value: ^YorvoID\\Core\\Clock\\.*
            - type: classLike
              value: ^YorvoID\\Core\\Crypto\\.*
            - type: classLike
              value: ^YorvoID\\Core\\Event\\.*
            - type: classLike
              value: ^YorvoID\\Core\\Exception\\.*
            - type: classLike
              value: ^YorvoID\\Core\\Id\\.*
            - type: classLike
              value: ^YorvoID\\Core\\Key\\.*
            - type: classLike
              value: ^YorvoID\\Core\\Log\\.*
            - type: classLike
              value: ^YorvoID\\Core\\Migrations\\.*
            - type: classLike
              value: ^YorvoID\\Core\\Operation\\.*
            - type: classLike
              value: ^YorvoID\\Core\\Principal\\.*
            - type: classLike
              value: ^YorvoID\\Core\\Storage\\.*
            - type: classLike
              value: ^YorvoID\\Core\\[A-Za-z]+$
  ruleset:
    Authorization:
      - Clock
      - Crypto
      - Event
      - Exception
      - Id
      # The realm's MAC key, for the attributes a decision read (AttributeMacs, M-9).
      - Key
      - Log
      - Operation
      - Principal
      - Root
      - Storage
    Clock: ~
    Crypto:
      - Exception
      # A MAC's key is a Secret (Mac).
      - Root
    Evaluator:
      - Authorization
      - Event
      - Exception
      - Id
      - Operation
      # The principals its forbid on deleting an owner of agents reads (OwnersKeepTheirAgents).
      - Principal
      - Root
      - Storage
    Event:
      - Exception
      - Root
    Exception: ~
    Id:
      - Exception
    Key:
      # A MAC key MACs through Crypto's HMAC (MacKey).
      - Crypto
      - Exception
      - Root
    Log:
      - Crypto
      - Event
      - Exception
      - Id
      - Key
      - Operation
      - Principal
      - Root
      - Storage
    Migrations:
      - Authorization
      - Log
      - Principal
      - Storage
    Operation:
      - Authorization
      - Event
      - Exception
      - Id
      - Log
      - Principal
      - Root
      # Operations::run() runs an operation, its decision included, again when its transaction conflicts.
      - Storage
    Principal:
      - Event
      - Exception
      - Id
      - Log
      - Operation
      - Root
      - Storage
    Root:
      - Exception
    Unlisted: ~
    Storage:
      - Event
      - Exception
      - Log
      - Root
